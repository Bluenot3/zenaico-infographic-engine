<text x="120" y="237" font-family="Arial" font-size="27" fill="#BCD2DF">First official November 15 Q&amp;A narrows the investigation; causation remains unresolved.</text>
<text x="120" y="287" font-family="Arial" font-size="24" fill="#75DAE8">THE REPORTED CONTROL-PLANE CHAIN  •  PRELIMINARY</text><rect x="100" y="319" width="515" height="289" rx="18" fill="#10273A" stroke="#71DCEB" stroke-opacity=".67" stroke-width="2"/><rect x="100" y="319" width="8" height="289" rx="4" fill="#71DCEB"/><text x="128" y="373" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">01  EL DORADO, AR</text><text x="128" y="420" font-family="Arial" font-size="25" fill="#CCE0EE">New router at radio site during</text><text x="128" y="458" font-family="Arial" font-size="25" fill="#CCE0EE">copper-to-fiber maintenance;</text><text x="128" y="496" font-family="Arial" font-size="25" fill="#CCE0EE">L3Harris contractor network.</text><text x="128" y="587" font-family="Arial" font-size="20" font-weight="bold" fill="#71DCEB" letter-spacing="2">OFFICIAL FAA / NOV 15</text><rect x="703" y="319" width="515" height="289" rx="18" fill="#10273A" stroke="#E3B47A" stroke-opacity=".67" stroke-width="2"/><rect x="703" y="319" width="8" height="289" rx="4" fill="#E3B47A"/><text x="731" y="373" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">02  AMARILLO, TX</text><text x="731" y="420" font-family="Arial" font-size="25" fill="#CCE0EE">Separate radar site identified;</text><text x="731" y="458" font-family="Arial" font-size="25" fill="#CCE0EE">Duffy: earlier work completed</text><text x="731" y="496" font-family="Arial" font-size="25" fill="#CCE0EE">weeks before November 13.</text><text x="731" y="587" font-family="Arial" font-size="20" font-weight="bold" fill="#E3B47A" letter-spacing="2">FAA + DUFFY / NOV 15</text><rect x="1306" y="319" width="515" height="289" rx="18" fill="#10273A" stroke="#B6A6F0" stroke-opacity=".67" stroke-width="2"/><rect x="1306" y="319" width="8" height="289" rx="4" fill="#B6A6F0"/><text x="1334" y="373" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">03  SHARED FTI</text><text x="1334" y="420" font-family="Arial" font-size="25" fill="#CCE0EE">1,000 connection attempts</text><text x="1334" y="458" font-family="Arial" font-size="25" fill="#CCE0EE">every 4–5 seconds; unstable</text><text x="1334" y="496" font-family="Arial" font-size="25" fill="#CCE0EE">communications and radar feeds.</text><text x="1334" y="587" font-family="Arial" font-size="20" font-weight="bold" fill="#B6A6F0" letter-spacing="2">REPORTED EFFECT / NOT ROOT CAUSE</text><path d="M615 460 H690 M1218 460 H1290" stroke="#C2DDEE" stroke-width="4" stroke-dasharray="10 12"/><path d="M681 452l13 8-13 8M1281 452l13 8-13 8" fill="none" stroke="#C2DDEE" stroke-width="4"/><rect x="101" y="638" width="1718" height="106" rx="18" fill="#15283C" stroke="#466780"/><text x="134" y="679" font-family="Arial" font-size="29" font-weight="bold" fill="#EDF7FD">RESPONSE</text><text x="360" y="680" font-family="Arial" font-size="27" fill="#D4E5F3">L3Harris blocked both sites; broadcast function disabled on ~60 similar routers.</text><text x="360" y="720" font-family="Arial" font-size="23" fill="#F4C890">Function/protocol and final defective component have NOT been publicly identified.</text></rect><rect x="100" y="773" width="405" height="166" rx="16" fill="#081729" stroke="#47738F"/><text x="122" y="850" font-family="Arial" font-size="46" font-weight="bold" fill="#8AE3F0">17 / 22</text><text x="122" y="891" font-family="Arial" font-size="19" fill="#B3CFDE">EN ROUTE CENTERS AFFECTED</text></rect><rect x="535" y="773" width="405" height="166" rx="16" fill="#081729" stroke="#47738F"/><text x="557" y="850" font-family="Arial" font-size="46" font-weight="bold" fill="#8AE3F0">~3,500</text><text x="557" y="891" font-family="Arial" font-size="19" fill="#B3CFDE">AIRCRAFT LANDED SAFELY</text></rect><rect x="970" y="773" width="405" height="166" rx="16" fill="#081729" stroke="#47738F"/><text x="992" y="850" font-family="Arial" font-size="46" font-weight="bold" fill="#8AE3F0">12,462</text><text x="992" y="891" font-family="Arial" font-size="19" fill="#B3CFDE">FRIDAY CANCELLATIONS*</text></rect><rect x="1405" y="773" width="405" height="166" rx="16" fill="#081729" stroke="#47738F"/><text x="1427" y="850" font-family="Arial" font-size="31" font-weight="bold" fill="#8AE3F0">NO CYBER EVIDENCE</text><text x="1427" y="891" font-family="Arial" font-size="19" fill="#B3CFDE">FAA INVESTIGATOR POSITION</text></rect>
