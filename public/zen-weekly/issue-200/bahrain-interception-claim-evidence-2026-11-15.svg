<text x="1311" y="462" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#e0d1ff">CIVILIAN WARNINGS</text>
<text x="1296" y="522" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" letter-spacing="0" fill="#f3eaff">Interior Ministry / media</text>
<text x="1296" y="572" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#e4def0">Two public threat alerts; blasts</text><text x="1296" y="609" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#e4def0">and sirens were also reported.</text><text x="1296" y="646" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#e4def0">Neither establishes target damage.</text>
<text x="1296" y="690" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="0" fill="#d2bdf9">IMPACT LOCATION: UNKNOWN</text>
