<text x="131" y="522" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing="0" fill="#effbff">Bahrain Defence Force</text>
<text x="131" y="572" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#d9e9ed">Reports several Iranian aerial</text><text x="131" y="609" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#d9e9ed">attacks intercepted and destroyed</text><text x="131" y="646" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#d9e9ed">before reaching stated objectives.</text>
<text x="131" y="690" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="0" fill="#72eee0">CONFIRMED: BDF stated this</text>
</g>
<g>
<rect x="686" y="416" width="548" height="315" rx="22" fill="url(#panel)" stroke="#e6a67e" stroke-width="2"/>
<rect x="706" y="436" width="199" height="38" rx="19" fill="#593725"/>
<text x="731" y="462" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#ffd3a2">BELLIGERENT CLAIM</text>
<text x="714" y="522" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing="0" fill="#ffefdd">Iranian IRGC</text>
<text x="714" y="572" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#f1d8c7">Claims six drones targeted a US</text><text x="714" y="609" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#f1d8c7">air-defence radar at Al-Riffa</text><text x="714" y="646" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#f1d8c7">helicopter base.</text>
<text x="714" y="690" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="0" fill="#ffbd87">RADAR IMPACT: NOT VERIFIED</text>
