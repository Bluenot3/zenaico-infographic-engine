<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ZEN Weekly Issue 200 investigation infographic"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c18"/><stop offset=".65" stop-color="#101d32"/><stop offset="1" stop-color="#071321"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#51e7f7"/><stop offset="1" stop-color="#288eb2"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#0e334b" stroke-width=".7"/></pattern><radialGradient id="glow"><stop stop-color="#1b5e74" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".65"/><ellipse cx="980" cy="385" rx="800" ry="500" fill="url(#glow)"/><text x="58" y="56" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#79e8f5" >ZEN WEEKLY / ISSUE 200</text><text x="1535" y="56" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#9bbacb" text-anchor="end">DEVELOPING STORY • 14 NOV 2026</text><path d="M58,78 L1542,78" stroke="#396c86" stroke-width="2" fill="none"/><text x="58" y="149" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="800" fill="#f7fbff" >FAA: THE REPORTED FAILURE CHAIN</text><text x="60" y="190" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#79e8f5" >OFFICIAL ACCOUNT • NOT A COMPLETED FORENSIC ROOT-CAUSE ANALYSIS</text><text x="60" y="225" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" fill="#a6bdcb" >A routine remote-site telecommunications change propagated into nationwide operational effects.</text><rect x="54" y="272" width="348" height="331" rx="22" fill="#09192d" stroke="#67e5f4" stroke-width="2"/><text x="77" y="320" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#67e5f4" >01</text><text x="142" y="319" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" fill="#c5eaf2" >REMOTE CHANGE</text><path d="M77,344 L374,344" stroke="#67e5f4" stroke-width="1" fill="none"/><text x="77" y="404" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="800" fill="#fff" >Copper → fiber</text><text x="77" y="463" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >L3Harris conducting routine work</text><text x="77" y="497" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >at a remote FAA location</text><text x="77" y="531" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#9fb4c4" >Exact location not disclosed</text><text x="411" y="447" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="800" fill="#7ddded" >→</text><rect x="441" y="272" width="348" height="331" rx="22" fill="#09192d" stroke="#67e5f4" stroke-width="2"/><text x="464" y="320" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#67e5f4" >02</text><text x="529" y="319" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" fill="#c5eaf2" >ROUTER RESPONSE</text><path d="M464,344 L761,344" stroke="#67e5f4" stroke-width="1" fill="none"/><text x="464" y="404" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="800" fill="#fff" >&gt;1,000 attempts</text><text x="464" y="463" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >per 4–5 seconds, reported</text><text x="464" y="497" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >by Transportation Secretary Duffy</text><text x="464" y="531" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#9fb4c4" >Not established as malicious traffic</text><text x="798" y="447" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="800" fill="#7ddded" >→</text><rect x="828" y="272" width="348" height="331" rx="22" fill="#09192d" stroke="#f6bc66" stroke-width="2"/><text x="851" y="320" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#f6bc66" >03</text><text x="916" y="319" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" fill="#c5eaf2" >NETWORK IMPACT</text><path d="M851,344 L1148,344" stroke="#f6bc66" stroke-width="1" fill="none"/><text x="851" y="404" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="800" fill="#fff" >Legacy instability</text><text x="851" y="463" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >Radar-data feeds disrupted</text><text x="851" y="497" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >Controller–aircraft communications</text><text x="851" y="531" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#9fb4c4" >Specific propagation path still open</text><text x="1185" y="447" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="800" fill="#7ddded" >→</text><rect x="1215" y="272" width="348" height="331" rx="22" fill="#09192d" stroke="#f6bc66" stroke-width="2"/><text x="1238" y="320" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#f6bc66" >04</text><text x="1303" y="319" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" fill="#c5eaf2" >NATIONAL ACTION</text><path d="M1238,344 L1535,344" stroke="#f6bc66" stroke-width="1" fill="none"/><text x="1238" y="404" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="800" fill="#fff" >Ground stop</text><text x="1238" y="463" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >Nov 13, ~3:36–8:15 p.m. ET</text><text x="1238" y="497" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#d5e7f2" >Flights later resumed</text><text x="1238" y="531" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#9fb4c4" >Airline recovery extended Nov 14</text><rect x="54" y="637" width="1492" height="142" rx="19" fill="#0a2030" stroke="#387d8c" stroke-width="1.4"/><text x="82" y="684" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffbc65" >STILL UNKNOWN</text><text x="82" y="720" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#e8f6ff" >Defective router vs. installer error • Why containment failed • Exact equipment/configuration • Final RCA</text><text x="82" y="756" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#a5bece" >Officials reported no evidence of cyberattack or AI involvement. This flow illustrates reported sequence, not certified topology.</text><path d="M56,826 L1544,826" stroke="#30657e" stroke-width="1" fill="none"/><text x="58" y="860" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#a0c3d3" >SOURCES  U.S. DOT briefing Nov 13 • NPR / ABC News Nov 14 • GAO Sept 2026</text><text x="1542" y="860" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#65d7e8" text-anchor="end">ZEN AI CO.  /  EVIDENCE FIRST</text></svg>