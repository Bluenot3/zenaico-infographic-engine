<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ZEN Weekly Issue 200 technical investigation"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050d18"/><stop offset=".55" stop-color="#0b1e31"/><stop offset="1" stop-color="#060b19"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#14374e" stroke-width=".65"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".6"/><text x="55" y="57" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="28" fill="#7ce5f2" >ZEN WEEKLY</text><text x="1538" y="55" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="21" fill="#aecad4" text-anchor="end">14 NOV 2026  •  INVESTIGATIVE COMPARISON</text><path d="M55 77L1545 77" stroke="#3b7892" stroke-width="2"/><text x="55" y="143" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="51" fill="#fbfdff" >THE SAME RISK CATEGORY — 17 YEARS APART</text><text x="57" y="187" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#acd2e2" >Two distinct FAA telecom incidents involving Harris / L3Harris. Historical comparison, NOT identical technical root causes.</text><rect x="55" y="240" width="725" height="503" rx="22" fill="#0a1c30" stroke="#59dce9" stroke-width="2"/><rect x="816" y="240" width="730" height="503" rx="22" fill="#0e2031" stroke="#f0af63" stroke-width="2"/><text x="87" y="289" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="29" fill="#7ae9f7" >NOVEMBER 19, 2009</text><text x="844" y="289" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="29" fill="#ffc780" >NOVEMBER 13, 2026</text><path d="M87 314L748 314" stroke="#367c91" stroke-width="1"/><path d="M844 314L1515 314" stroke="#8d6845" stroke-width="1"/><text x="88" y="360" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#ffffff" >HARRIS CORP. / FTI</text><text x="844" y="360" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#ffffff" >L3HARRIS / FAA TELECOM</text><text x="87" y="408" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="73" fill="#77ebf6" >129</text><text x="252" y="406" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="25" fill="#c4e7ec" >air traffic facilities affected</text><text x="87" y="475" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="66" fill="#77ebf6" >~75%</text><text x="335" y="473" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="23" fill="#c4e7ec" >of fiber-network routes blocked</text><text x="87" y="534" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="41" fill="#fff" >5 hours</text><text x="275" y="532" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="25" fill="#bdcddc" >delayed restoration</text><text x="87" y="591" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#83e8f4" >KNOWN 2009 MECHANISM</text><text x="87" y="628" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#e6f4fb" >Wrong route map copied between routers;</text><text x="87" y="660" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="21" fill="#e6f4fb" >network alarm filter suppressed all alerts.</text><text x="845" y="408" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="70" fill="#ffc17a" >17 / 22</text><text x="1122" y="406" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="23" fill="#f4e5d5" >en route centers affected</text><text x="845" y="474" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="63" fill="#ffc17a" >&gt;1,000</text><text x="1110" y="474" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="#f4e5d5" >attempts / 4–5 seconds</text><text x="845" y="534" font-family="Arial,Helvetica,sans-serif" font-weight="780" font-size="28" fill="#ffffff" >ROOT CAUSE PENDING</text><text x="845" y="590" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#ffc17a" >REPORTED 2026 MECHANISM</text><text x="845" y="627" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#e6f4fb" >Copper-to-fiber work at a remote FAA site;</text><text x="845" y="659" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#e6f4fb" >installation error vs. router fault unresolved.</text><rect x="55" y="770" width="1490" height="79" rx="17" fill="#102d40" stroke="#538598" stroke-width="1.4"/><text x="82" y="805" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="21" fill="#90eff4" >KEY DISTINCTION</text><text x="82" y="834" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#e1f4fa" >The 2009 fault and safeguards were different. Shared contractor and upgrade risk do not prove a recurring identical fault.</text><text x="56" y="890" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="17" fill="#8fb8c7" >PRIMARY: U.S. DOT OIG CC-2010-012 (Jun 17, 2010) • FAA FTI Review Panel (Apr 2010)</text><text x="1540" y="890" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="17" fill="#8fb8c7" text-anchor="end">2026: DOT / Reuters (Nov 14)</text></svg>