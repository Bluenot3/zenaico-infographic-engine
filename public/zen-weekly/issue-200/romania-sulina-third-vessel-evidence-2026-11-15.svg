<text x="1780" y="107" text-anchor="end" font-family="Arial" font-size="27" fill="#A4C5D8">EVIDENCE DOSSIER  ·  15 NOV 2026</text>
<text x="120" y="189" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="bold" fill="#F4F8FF">SULINA: A THIRD OVERNIGHT VESSEL</text>
<text x="120" y="237" font-family="Arial" font-size="27" fill="#BCD2DF">Romanian defence ministry confirms Ali Najafov; preserve the earlier two-ship record.</text>
<text x="115" y="287" font-family="Arial" font-size="24" fill="#78D8EC">CORRECTION OF THE NOVEMBER 15 EARLY-WINDOW INVENTORY  •  NOT A NEW STRIKE TODAY</text><rect x="100" y="330" width="826" height="262" rx="18" fill="#10273A" stroke="#84E5E6" stroke-opacity=".67" stroke-width="2"/><rect x="100" y="330" width="8" height="262" rx="4" fill="#84E5E6"/><text x="128" y="384" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">NOV 13  /  SEPARATE DAY</text><text x="128" y="431" font-family="Arial" font-size="25" fill="#CCE0EE">LARISSA 1  •  general cargo</text><text x="128" y="469" font-family="Arial" font-size="25" fill="#CCE0EE">Reported Friday drone damage;</text><text x="128" y="507" font-family="Arial" font-size="25" fill="#CCE0EE">different incident window.</text><text x="128" y="571" font-family="Arial" font-size="20" font-weight="bold" fill="#84E5E6" letter-spacing="2">ATTRIBUTED / NO REPORTED CASUALTIES</text><rect x="991" y="330" width="826" height="262" rx="18" fill="#10273A" stroke="#8DD2A2" stroke-opacity=".67" stroke-width="2"/><rect x="991" y="330" width="8" height="262" rx="4" fill="#8DD2A2"/><text x="1019" y="384" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">NOV 14  /  SATURDAY EVENING</text><text x="1019" y="431" font-family="Arial" font-size="25" fill="#CCE0EE">EVIA PETROL V  •  21:10 EET</text><text x="1019" y="469" font-family="Arial" font-size="25" fill="#CCE0EE">MARSOL  •  21:45 EET</text><text x="1019" y="507" font-family="Arial" font-size="25" fill="#CCE0EE">Crew-contained onboard fires.</text><text x="1019" y="571" font-family="Arial" font-size="20" font-weight="bold" fill="#8DD2A2" letter-spacing="2">MApN REPORTED / TWO SHIPS</text><rect x="100" y="620" width="826" height="262" rx="18" fill="#10273A" stroke="#F1C181" stroke-opacity=".67" stroke-width="2"/><rect x="100" y="620" width="8" height="262" rx="4" fill="#F1C181"/><text x="128" y="674" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">NOV 14–15  /  OVERNIGHT</text><text x="128" y="721" font-family="Arial" font-size="25" fill="#CCE0EE">ALI NAJAFOV  •  third vessel</text><text x="128" y="759" font-family="Arial" font-size="25" fill="#CCE0EE">MApN: struck near Danube mouth;</text><text x="128" y="797" font-family="Arial" font-size="25" fill="#CCE0EE">fire extinguished, no fatalities.</text><text x="128" y="861" font-family="Arial" font-size="20" font-weight="bold" fill="#F1C181" letter-spacing="2">NOV 15 GOVERNMENT CONFIRMATION</text><rect x="991" y="620" width="826" height="262" rx="18" fill="#10273A" stroke="#BB9CEC" stroke-opacity=".67" stroke-width="2"/><rect x="991" y="620" width="8" height="262" rx="4" fill="#BB9CEC"/><text x="1019" y="674" font-family="Arial" font-size="31" font-weight="bold" fill="#F3F8FF">WHAT IS NOT CONFIRMED</text><text x="1019" y="721" font-family="Arial" font-size="25" fill="#CCE0EE">Drone launch point or operator;</text><text x="1019" y="759" font-family="Arial" font-size="25" fill="#CCE0EE">exact strike time/site for Ali;</text><text x="1019" y="797" font-family="Arial" font-size="25" fill="#CCE0EE">shipping lane closure or NATO action.</text><text x="1019" y="861" font-family="Arial" font-size="20" font-weight="bold" fill="#BB9CEC" letter-spacing="2">CAUSAL ATTRIBUTION REMAINS OPEN</text><text x="118" y="930" font-family="Arial" font-size="29" fill="#E1EFF9" font-weight="bold">REVISED INVENTORY:</text><text x="470" y="930" font-family="Arial" font-size="29" fill="#8CDEE9">3 vessels in Nov 14–15 overnight window</text><text x="1285" y="930" font-family="Arial" font-size="26" fill="#F4C486">+ 1 separate Nov 13 vessel</text>
<rect x="85" y="982" width="1750" height="1" fill="#55708D"/><text x="120" y="1021" font-family="Arial" font-size="23" fill="#A7C6DC">Sources: MApN statement quoted News.ro, Nov 15; Reuters, Nov 15; prior ZEN Update 012.</text>
