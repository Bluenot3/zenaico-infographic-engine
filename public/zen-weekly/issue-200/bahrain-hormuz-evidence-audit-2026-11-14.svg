<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ZEN Weekly Issue 200 investigation infographic"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c18"/><stop offset=".65" stop-color="#101d32"/><stop offset="1" stop-color="#071321"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#51e7f7"/><stop offset="1" stop-color="#288eb2"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#0e334b" stroke-width=".7"/></pattern><radialGradient id="glow"><stop stop-color="#1b5e74" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".65"/><ellipse cx="980" cy="385" rx="800" ry="500" fill="url(#glow)"/><text x="58" y="56" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#79e8f5" >ZEN WEEKLY / ISSUE 200</text><text x="1535" y="56" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#9bbacb" text-anchor="end">DEVELOPING STORY • 14 NOV 2026</text><path d="M58,78 L1542,78" stroke="#396c86" stroke-width="2" fill="none"/><text x="58" y="149" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="800" fill="#f7fbff" >HORMUZ + BAHRAIN: CLAIMS VS. RECORDS</text><text x="60" y="190" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#79e8f5" >COUNTER-CHECKING THE MILITARY AND MARITIME EVIDENCE</text><text x="60" y="225" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" fill="#a6bdcb" >An Iranian military claim, a U.S. military denial, and separately documented earlier tanker incidents.</text><rect x="54" y="267" width="720" height="493" rx="22" fill="#141d29" stroke="#e8a84b" stroke-width="1.8"/><text x="85" y="313" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#e9b56a" >BAHRAIN  /  NOV 13</text><text x="85" y="355" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#e4a95a" >IRANIAN CLAIM</text><text x="85" y="389" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="720" fill="#fff" >U.S. early-warning radar destroyed</text><path d="M85,412 L744,412" stroke="#6c5f4a" stroke-width="1" fill="none"/><text x="85" y="459" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#6ce1dd" >U.S. CENTRAL COMMAND STATEMENT</text><text x="85" y="503" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#e8f7fa" >Two Iranian one-way attack drones intercepted</text><text x="85" y="541" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#e8f7fa" >No facility damage or injuries reported</text><rect x="85" y="582" width="635" height="63" rx="12" fill="#0c3239" stroke="#2d9b93" stroke-width="1"/><text x="106" y="622" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#7de4db" >RADAR DESTRUCTION: DISPUTED / NOT VERIFIED</text><text x="85" y="703" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#bbc9d5" >No evidence this event caused the FAA outage.</text><rect x="807" y="267" width="739" height="493" rx="22" fill="#101d30" stroke="#75c2e6" stroke-width="1.8"/><text x="839" y="313" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#80d6ec" >STRAIT OF HORMUZ  /  NOV 8–14</text><text x="839" y="354" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#e9b46b" >NOV 14 IRANIAN MINE CLAIM</text><text x="839" y="389" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" fill="#fff" >Reported tanker fire / naval mine — unverified</text><path d="M839,410 L1510,410" stroke="#38647f" stroke-width="1" fill="none"/><text x="839" y="454" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#70dce7" >UKMTO EARLIER INDEPENDENT NOTICES</text><text x="839" y="496" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" fill="#e8f7fa" >#200 (Nov 8): Tanker struck by unknown projectile</text><text x="839" y="528" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" fill="#adc1cf" >Crew safe; no environmental impact reported</text><text x="839" y="576" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" fill="#e8f7fa" >#203 (Nov 10): Tanker struck by unknown projectile</text><text x="839" y="608" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" fill="#adc1cf" >Multiple casualties reported; attribution not established</text><text x="839" y="682" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" fill="#ffd29a" >These notices do NOT verify Nov 14 mine allegations.</text><rect x="54" y="785" width="1492" height="73" rx="14" fill="#142a3c" stroke="#427b96" stroke-width="1"/><text x="77" y="827" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="640" fill="#e5f5fb" >ASSESSMENT  •  U.S. military statement is confirmed as a statement; claimed Iranian successes remain disputed or unverified.</text><text x="57" y="892" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#9ebfce" >SOURCES  U.S. CENTCOM Nov 13 • Reuters / AP Nov 14 • UKMTO official recent-incidents notices #200 and #203</text></svg>